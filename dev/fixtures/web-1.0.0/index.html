<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>CatLog 猫咪日志</title>
<meta name="description" content="猫咪生活日志：体重、日常状态、疫苗、照片和文件，两个人一起记。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CatLog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hdr" hidden></header>
  <main id="view" aria-live="off"></main>
  <nav id="tabs" aria-label="主导航" hidden></nav>
</div>
<div id="sheet-root"></div>
<div id="viewer-root"></div>
<div id="toast-root" aria-live="polite"></div>
<input type="file" id="pick-photo" class="offscreen" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="pick-file" class="offscreen" accept="image/*,application/pdf,.pdf" multiple tabindex="-1" aria-hidden="true">
<noscript><p style="padding:24px;font:16px/1.6 system-ui">CatLog 需要打开 JavaScript 才能用。</p></noscript>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
